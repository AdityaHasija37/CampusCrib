name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  h2:
    name: Tests (embedded H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: ./mvnw -B package

  mysql:
    name: Tests (MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: campuscrib_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -ptest" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CAMPUSCRIB_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/campuscrib_test?allowPublicKeyRetrieval=true&useSSL=false
      CAMPUSCRIB_TEST_DB_USER: root
      CAMPUSCRIB_TEST_DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: ./mvnw -B test
