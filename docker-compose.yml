# Local MySQL for CampusCrib: `docker compose up -d`, then use campuscrib.properties.example as-is
# after setting db.password=campuscrib.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campuscrib
      MYSQL_USER: campuscrib
      MYSQL_PASSWORD: campuscrib
      MYSQL_ROOT_PASSWORD: campuscrib-root
    ports:
      - "3306:3306"
    volumes:
      - campuscrib-mysql:/var/lib/mysql
volumes:
  campuscrib-mysql:
